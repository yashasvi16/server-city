# Render Blueprint for the Go backend (free plan, no card).
# Render: New → Blueprint → pick this repo. The website itself is hosted on
# Cloudflare (Workers static assets); see deploy/DEPLOY.md.
services:
  - type: web
    name: yashasvi-city-api
    runtime: go
    plan: free
    region: singapore # closest Render region to India
    rootDir: backend
    buildCommand: go build -trimpath -ldflags "-s -w" -o app ./cmd/server
    startCommand: ./app
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ADDR
        value: ":10000"
      # The free plan's disk is wiped on restart and spin-down, so the
      # guestbook and leaderboard last as long as the instance does.
      - key: DATA_DIR
        value: /tmp/server-city
      - key: ALLOWED_ORIGINS
        value: https://yashasvi-rathore.yashasvi-xvi.workers.dev,https://yashasvi-rathore.pages.dev,https://yashasvi.is-a.dev
      # Render sits behind Cloudflare, which sets CF-Connecting-IP to the
      # visitor's address and overwrites any value a client sends.
      # (Measured: X-Forwarded-For is "visitor, cloudflare-edge, render-internal".)
      - key: CLIENT_IP_HEADER
        value: CF-Connecting-IP
      - key: RUN_SECRET
        generateValue: true
